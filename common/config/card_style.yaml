# =============================================================================
# CONFIG: CARD STYLE - adjustable card spacing and label size
# =============================================================================
# Runtime settings, shown in the panel's web page under Screen > Card Style.
# Included only by devices that opt in with firmware.package.cardStyleControls.
# The grid code reads these values every time it builds the cards, so changing
# either one simply redraws the grid.
#
#   Card Spacing  gap between cards in pixels (default: the panel's own gap)
#   Label Size    Small / Medium / Large card label text
#   Card Alignment  Left (icon and label at the left) or Centered
#
# The device fonts file must define font_text_small, font_text_body and
# font_text_body_large.
# =============================================================================

# Standard colours "Name=RRGGBB;Name=RRGGBB". A card colour written as "@Name" follows this list.
text:
  - platform: template
    name: "${entity_screen_color_palette}"
    id: color_palette_text
    entity_category: config
    icon: "mdi:palette"
    optimistic: true
    restore_value: true
    initial_value: "Aan=FF8C00;Uit=313131;Geel=FFB300;Groen=66BB6A;Blauw=1E88E5;Lichtblauw=4FC3F7;Rood=E64A19;Paars=8F28AB;Grijs=7B797F"
    min_length: 0
    max_length: 255
    mode: text
    web_server:
      sorting_group_id: sg_display
    on_value:
      then:
        - if:
            condition:
              lambda: 'return grid_phase2_complete();'
            then:
              - script.execute: refresh_subpage_grid

number:
  - platform: template
    name: "${entity_screen_card_spacing}"
    id: card_gap_number
    entity_category: config
    icon: "mdi:arrow-expand-horizontal"
    optimistic: true
    restore_value: true
    initial_value: ${main_page_card_gap}
    min_value: 0
    max_value: 24
    step: 1
    mode: box
    unit_of_measurement: "px"
    web_server:
      sorting_group_id: sg_display
    on_value:
      then:
        - if:
            condition:
              lambda: 'return grid_phase2_complete();'
            then:
              - script.execute: refresh_subpage_grid

select:
  # Screen: Grid Size. "Default" is the panel's own grid; the others only apply on panels that
  # have slots for them (the web page offers just those).
  - platform: template
    name: "${entity_screen_grid_size}"
    id: grid_size_select
    entity_category: config
    icon: "mdi:view-grid"
    optimistic: true
    restore_value: true
    initial_option: "Default"
    options:
      - "Default"
      - "2x3"
      - "3x3"
      - "3x4"
      - "4x4"
    web_server:
      sorting_group_id: sg_display
    on_value:
      then:
        - if:
            condition:
              lambda: 'return grid_phase2_complete();'
            then:
              - script.execute: refresh_subpage_grid

  - platform: template
    name: "${entity_screen_card_alignment}"
    id: card_alignment_select
    entity_category: config
    icon: "mdi:format-align-center"
    optimistic: true
    restore_value: true
    initial_option: "Left"
    options:
      - "Left"
      - "Centered"
    web_server:
      sorting_group_id: sg_display
    on_value:
      then:
        - if:
            condition:
              lambda: 'return grid_phase2_complete();'
            then:
              - script.execute: refresh_subpage_grid

  - platform: template
    name: "${entity_screen_label_size}"
    id: label_size_select
    entity_category: config
    icon: "mdi:format-size"
    optimistic: true
    restore_value: true
    initial_option: "Medium"
    options:
      - "Small"
      - "Medium"
      - "Large"
    web_server:
      sorting_group_id: sg_display
    on_value:
      then:
        - if:
            condition:
              lambda: 'return grid_phase2_complete();'
            then:
              - script.execute: refresh_subpage_grid
